function closeAdminModal(){S.adminModal=false;S.adminError='';render()}function validateAdminName(){if(!S.adminForm.name.trim()){S.adminError=`请填写${ADMIN_CFG[S.adminSection].entity}名称`;render()}}function addAdminRef(){const nextSort=S.adminSection==='floor'?Math.max(0,...S.adminForm.refs.map(ref=>Number(ref.sort)||0))+1:1;S.adminForm.refs.push(blankAdminRef(nextSort));S.adminError='';render()}function removeAdminRef(i){if(S.adminForm.refs.length===1){S.adminError='至少需要保留 1 张图片';render();return}S.adminForm.refs.splice(i,1);S.adminError='';render()}
function adminRefFileChosen(e,i){const file=e.target.files&&e.target.files[0];if(!file)return;if(!/^image\/(png|jpeg)$/.test(file.type)||file.size>10*1024*1024){S.adminError='图片仅支持 10 MB 以内的 JPG / PNG';render();return}const ref=S.adminForm.refs[i];ref.file=true;ref.fileName=file.name;ref.fileUrl=URL.createObjectURL(file);if(!ref.name)ref.name=file.name.replace(/\.[^.]+$/,'');S.adminError='';render()}
function saveAdminConfig(){const cfg=ADMIN_CFG[S.adminSection],name=S.adminForm.name.trim(),sort=Number(S.adminForm.sort),refs=S.adminForm.refs||[],editIndex=S.adminForm.editIndex,current=Number.isInteger(editIndex)?ADMIN_DATA[S.adminSection][editIndex]:null;if(!name){S.adminError=`请填写${cfg.entity}名称`;render();return}if(!Number.isInteger(sort)||sort<1){S.adminError=`请填写有效的${cfg.entity}排序，最小为 1`;render();return}if(!refs.length){S.adminError=`请至少添加 1 张${cfg.image}`;render();return}const invalid=refs.findIndex(ref=>!ref.name.trim()||!ref.file||!Number.isInteger(Number(ref.sort))||Number(ref.sort)<1);if(invalid>=0){S.adminError=`第 ${invalid+1} 张${cfg.image}的名称、图片和排序均为必填项`;render();return}const now=Date.now(),base={name,sort,status:current?current.status:'启用',operator:'高志远',updatedAt:formatAdminTime(),createdAt:current?current.createdAt:now,refs:refs.map(ref=>({name:ref.name.trim(),image:ref.fileUrl,sort:Number(ref.sort),createdAt:ref.createdAt||now}))};if(current)ADMIN_DATA[S.adminSection][editIndex]=base;else ADMIN_DATA[S.adminSection].push(base);S.adminModal=false;toast(`${base.name} 已保存`)}
function back(){clearTimeout(S.loadingTimer);clearTimeout(S.rfidTimer);if((S.page==='chooseFloor'||S.page==='chooseEffect')&&S.sourceTab==='lib'&&S.libraryCategory!==null){closeLibraryCategory();return}if(S.page==='style'&&S.styleMode==='system'&&S.styleCategory!==null){closeStyleCategory();return}const map={source:'home',chooseFloor:'source',chooseEffect:'source',style:'chooseFloor',loadingBase:'style',mark:S.route==='floor'?'style':'chooseEffect',loadingReplace:'mark',compare:'mark',material:'home'};S.page=map[S.page]||'source';render()}
function toast(msg){S.toast=msg;render();setTimeout(()=>{S.toast='';render()},1500)}
function render(){let h='';if(S.page==='home')h=home();else if(S.page==='material')h=materialDetail();else if(S.page==='source')h=source();else if(S.page==='chooseFloor')h=choose('floor');else if(S.page==='chooseEffect')h=choose('effect');else if(S.page==='style')h=styleScreen();else if(S.page==='loadingBase')h=loading('base');else if(S.page==='loadingReplace')h=loading('replace');else if(S.page==='mark')h=markerScreen();else if(S.page==='compare')h=compareScreen();else if(S.page==='admin')h=admin();app.innerHTML=h+(S.toast?`<div class="toast" role="status">${S.toast}</div>`:'');if(S.page==='mark')initMarkers()}
function setPrototypeMode(mode){const dev=document.getElementById('ipad');dev.classList.toggle('admin-canvas',mode==='admin');document.getElementById('ipadMode').classList.toggle('on',mode==='ipad');document.getElementById('adminMode').classList.toggle('on',mode==='admin');S.page=mode==='ipad'?'home':'admin';fit();render()}
document.getElementById('ipadMode').onclick=()=>setPrototypeMode('ipad');document.getElementById('adminMode').onclick=()=>setPrototypeMode('admin');render();fit();
</script>
